name: Custom Windows installer
on:
  push:
    branches: [pg1.1-chatgpt-signin]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    needs: pg10-baseline
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NX_DAEMON: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Verify PG1.1 profile migration
        shell: powershell
        run: .\app\src-tauri\nsis\pg11-import-profile.Tests.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @graphif/project-graph type-check
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib chatgpt_auth::tests
      - run: cargo build --manifest-path app/src-tauri/Cargo.toml --bin project-graph-ownership-helper
      - name: Verify regression gate
        run: node --test scripts/pg11-regression-gate-checks.mjs
      - name: Run complete candidate frontend suite
        continue-on-error: true
        run: pnpm exec vitest run --reporter=default --reporter=./scripts/pg11-regression-reporter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PG1.1-regression-results
          path: regression-results.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: PG1.0-regression-results
          path: baseline-results
      - name: Block new regressions before packaging
        run: node scripts/pg11-regression-gate.mjs baseline-results/regression-results.json regression-results.json
      - run: pnpm --filter @graphif/project-graph sync-locales
      - name: Build Windows installer
        run: pnpm build:ci
        env:
          TAURI_BUILD_ARGS: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Graph-PG1.1-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Save installer as a draft release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName)
          gh release create "pg1.1-build-${{ github.run_number }}" @installers --target "${{ github.sha }}" --draft --title "Project Graph PG1.1 ${{ github.run_number }}" --notes-file PG1.1.md

  pg10-baseline:
    if: github.ref == 'refs/heads/pg1.1-chatgpt-signin'
    name: PG1.0 immutable baseline regression
    defaults:
      run:
        working-directory: baseline
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      NX_DAEMON: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39e3fd17da43e56575f7aa25e800dda1f3e3f62f
          path: baseline
      - uses: actions/checkout@v4
        with:
          path: validation-tools
          sparse-checkout: scripts
      - name: Add reporting only to the immutable baseline
        shell: pwsh
        run: Copy-Item ../validation-tools/scripts/pg11-regression-reporter.mjs ./pg11-regression-reporter.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: baseline/app/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @graphif/project-graph type-check
      - run: cargo build --manifest-path app/src-tauri/Cargo.toml --bin project-graph-ownership-helper
      - name: Run complete baseline frontend suite
        continue-on-error: true
        run: pnpm exec vitest run --reporter=default --reporter=./pg11-regression-reporter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PG1.0-regression-results
          path: baseline/regression-results.json
          if-no-files-found: error
