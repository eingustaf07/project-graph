name: Custom Windows installer
on:
  push:
    branches: [pg1.1-chatgpt-signin, pg11-ui-fix-package-20261012, pg11-ai-tree-safety-20261029]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      reuse_verified_candidate:
        description: Reuse exact verified PG1.3 source regression report for startup harness repair
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    needs: pg10-baseline
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      NX_DAEMON: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
    steps:
      - uses: actions/checkout@v4
      - name: Verify PG profile preservation
        shell: powershell
        run: .\app\src-tauri\nsis\pg11-import-profile.Tests.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Reuse verified PG1.3 candidate for startup harness repair
        if: inputs.reuse_verified_candidate == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin 3440e29e4dce20b0d8698ba8f1065bf97730426c --depth=1
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify tested source commit' }
          git diff --exit-code 3440e29e4dce20b0d8698ba8f1065bf97730426c HEAD -- app packages package.json pnpm-lock.yaml pnpm-workspace.yaml scripts/pg11-regression-gate.mjs scripts/pg12-test-migrations.json
          if ($LASTEXITCODE -ne 0) { throw 'Application or regression gate changed; full tests must run again' }
          $changed = @(git diff --name-only 3440e29e4dce20b0d8698ba8f1065bf97730426c HEAD)
          if (@($changed | Where-Object { $_ -notin @('.github/workflows/custom-windows.yml', 'scripts/pg13-windows-startup-smoke.mjs') }).Count -gt 0) { throw 'Only the startup harness may change when reusing this exact report' }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = 'https://api.github.com/repos/eingustaf07/project-graph'
          $artifact = Invoke-RestMethod "$api/actions/artifacts/13039848139" -Headers $headers
          if ($artifact.expired -or $artifact.workflow_run.id -ne 41192352055 -or $artifact.workflow_run.head_sha -ne '3440e29e4dce20b0d8698ba8f1065bf97730426c' -or $artifact.name -ne 'PG1.3-regression-results') { throw 'Candidate report provenance mismatch' }
          Invoke-WebRequest "$api/actions/artifacts/13039848139/zip" -Headers $headers -OutFile candidate.zip
          if ((Get-FileHash candidate.zip).Hash -ne '49BDC6F34191F4E2975FD5CE01149AF7259C3A8556EFE4C15E37464328364FDC') { throw 'Candidate archive digest mismatch' }
          Expand-Archive candidate.zip -DestinationPath candidate-results
          Copy-Item candidate-results/regression-results.json regression-results.json
          Write-Output 'Reused exact report for unchanged application source at 3440e29. The baseline comparison and packaged startup checks still run.'
      - run: pnpm --filter @graphif/project-graph type-check
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib chatgpt_auth::tests
        if: inputs.reuse_verified_candidate != true
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --lib windows_clipboard_files::tests
        if: inputs.reuse_verified_candidate != true
      - run: cargo build --manifest-path app/src-tauri/Cargo.toml --bin project-graph-ownership-helper
        if: inputs.reuse_verified_candidate != true
      - name: Verify regression gate
        run: node --test scripts/pg11-regression-gate-checks.mjs
      - name: Run complete candidate frontend suite
        if: inputs.reuse_verified_candidate != true
        continue-on-error: true
        run: pnpm exec vitest run --maxWorkers=2 --reporter=default --reporter=./scripts/pg11-regression-reporter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PG1.4-regression-results
          path: regression-results.json
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: PG1.0-regression-results
          path: baseline-results
      - name: Block new regressions before packaging
        run: node scripts/pg11-regression-gate.mjs baseline-results/regression-results.json regression-results.json scripts/pg12-test-migrations.json
      - run: pnpm --filter @graphif/project-graph sync-locales
      - name: Build Windows installer
        run: pnpm build:ci
        env:
          TAURI_BUILD_ARGS: --bundles nsis
      - name: Verify packaged Windows application starts
        shell: pwsh
        run: |
          $installer = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -WindowStyle Hidden -PassThru
          if (!$install.WaitForExit(180000)) { Stop-Process -Id $install.Id; throw 'CI installation timed out' }
          if ($install.ExitCode -ne 0) { throw "CI installation failed: $($install.ExitCode)" }
          $pgConfig = Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pgInstalled = Join-Path $env:LOCALAPPDATA "$($pgConfig.productName)\$($pgConfig.mainBinaryName).exe"
          node scripts/pg13-windows-startup-smoke.mjs $pgInstalled
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PG1.4-startup-verification
          path: app/src-tauri/target/startup-smoke-result.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: PG1.4-quarantined-build-not-for-release
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Graph-PG1.4-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Save installer as a draft release
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName)
          gh release create "pg1.4-build-${{ github.run_number }}" @installers --target "${{ github.sha }}" --draft --title "Project Graph PG1.4 ${{ github.run_number }}" --notes-file PG1.4-RELEASE.txt

  pg10-baseline:
    if: github.ref == 'refs/heads/pg1.1-chatgpt-signin' || github.ref == 'refs/heads/pg11-ui-fix-package-20261012' || github.ref == 'refs/heads/pg11-ai-tree-safety-20261029' || github.ref == 'refs/heads/pg13-clipboard-20261030' || github.ref == 'refs/heads/pg14-copy-shortcuts-20261031'
    name: PG1.0 immutable baseline regression
    defaults:
      run:
        working-directory: baseline
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      NX_DAEMON: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Reuse verified immutable Windows baseline
        id: reuse
        continue-on-error: true
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $api = 'https://api.github.com/repos/eingustaf07/project-graph'
          $run = Invoke-RestMethod "$api/actions/runs/38168600852" -Headers $headers
          if ($run.head_sha -ne '4cb0505ac1513b8a11723294eb2116a733b656d1' -or $run.conclusion -ne 'success') { throw 'Baseline run provenance mismatch' }
          $artifact = Invoke-RestMethod "$api/actions/artifacts/11713372916" -Headers $headers
          if ($artifact.expired -or $artifact.workflow_run.id -ne 38168600852 -or $artifact.name -ne 'PG1.0-regression-results') { throw 'Baseline artifact mismatch' }
          Invoke-WebRequest "$api/actions/artifacts/11713372916/zip" -Headers $headers -OutFile baseline.zip
          if ((Get-FileHash baseline.zip).Hash -ne '7B9A481C804B43E8589FDF28AA2C9E72304C6FA89667002A59B0DDD7793B7837') { throw 'Baseline archive digest mismatch' }
          Expand-Archive baseline.zip -DestinationPath baseline -Force
          if ((Get-FileHash baseline/regression-results.json).Hash -ne '2B3C31D91ED28E1CFD4C353A7C4F84189156811D55AA2C3E642FF4F3F8FE4345') { throw 'Baseline report digest mismatch' }
          Write-Output 'Reused the exact PG1.0 report from the successful Windows build19. Candidate tests and regression gate still run in full.'
      - uses: actions/checkout@v4
        if: steps.reuse.outcome != 'success'
        with:
          ref: 39e3fd17da43e56575f7aa25e800dda1f3e3f62f
          path: baseline
      - uses: actions/checkout@v4
        if: steps.reuse.outcome != 'success'
        with:
          path: validation-tools
          sparse-checkout: scripts
      - name: Add reporting only to the immutable baseline
        if: steps.reuse.outcome != 'success'
        shell: pwsh
        run: Copy-Item ../validation-tools/scripts/pg11-regression-reporter.mjs ./pg11-regression-reporter.mjs
      - uses: actions/setup-node@v4
        if: steps.reuse.outcome != 'success'
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        if: steps.reuse.outcome != 'success'
        with:
          version: 11.3.0
      - uses: dtolnay/rust-toolchain@stable
        if: steps.reuse.outcome != 'success'
      - uses: Swatinem/rust-cache@v2
        if: steps.reuse.outcome != 'success'
        with:
          workspaces: baseline/app/src-tauri
      - run: pnpm install --frozen-lockfile
        if: steps.reuse.outcome != 'success'
      - run: pnpm --filter @graphif/project-graph type-check
        if: steps.reuse.outcome != 'success'
      - run: cargo build --manifest-path app/src-tauri/Cargo.toml --bin project-graph-ownership-helper
        if: steps.reuse.outcome != 'success'
      - name: Run complete baseline frontend suite
        if: steps.reuse.outcome != 'success'
        continue-on-error: true
        run: pnpm exec vitest run --maxWorkers=2 --reporter=default --reporter=./pg11-regression-reporter.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PG1.0-regression-results
          path: baseline/regression-results.json
          if-no-files-found: error
