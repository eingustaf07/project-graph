name: Custom Windows installer
on:
  push:
    branches: [custom/max-text-width]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      NX_DAEMON: "false"
      NODE_OPTIONS: --max-old-space-size=8192
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_RELEASE_LTO: "thin"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @graphif/project-graph type-check
      - run: pnpm exec vitest run app/src/core/stage/stageObject/entity/TextNode.maxWidth.test.tsx
      - run: pnpm --filter @graphif/project-graph sync-locales
      - name: Build Windows installer
        run: pnpm build:ci
        env:
          TAURI_BUILD_ARGS: --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Project-Graph-Custom-Windows
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Save installer as a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installers = @(Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object FullName)
          gh release create "custom-build-${{ github.run_number }}" @installers --target "${{ github.sha }}" --draft --title "Project Graph Custom ${{ github.run_number }}" --notes-file CUSTOM.md
